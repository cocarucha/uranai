<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔮 占い師ツール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Georgia', serif;
    background: #0d0a1a;
    color: #e8dff5;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 2.5rem 1rem 1.5rem;
    border-bottom: 1px solid rgba(180,140,255,0.15);
    background: linear-gradient(180deg, rgba(80,40,120,0.3) 0%, transparent 100%);
  }
  header h1 { font-size: 1.8rem; font-weight: 400; letter-spacing: 0.12em; color: #d4b8ff; }
  header p { font-size: 0.8rem; color: rgba(180,150,220,0.6); margin-top: 6px; letter-spacing: 0.1em; }

  .container { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

  /* APIキー設定 */
  .api-section {
    background: rgba(40,20,70,0.6);
    border: 1px solid rgba(180,140,255,0.2);
    border-radius: 12px;
    padding: 1.2rem 1.4rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .api-section label { font-size: 0.8rem; color: rgba(180,150,220,0.8); white-space: nowrap; letter-spacing: 0.05em; }
  .api-section input {
    flex: 1;
    min-width: 200px;
    background: rgba(20,10,40,0.8);
    border: 1px solid rgba(180,140,255,0.25);
    border-radius: 8px;
    padding: 9px 12px;
    color: #c8a8ff;
    font-family: monospace;
    font-size: 0.85rem;
    outline: none;
  }
  .api-section input:focus { border-color: rgba(180,140,255,0.6); }
  .api-save-btn {
    padding: 9px 18px;
    background: rgba(100,60,180,0.5);
    border: 1px solid rgba(180,140,255,0.4);
    border-radius: 8px;
    color: #d4b8ff;
    font-family: inherit;
    font-size: 0.82rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.2s;
  }
  .api-save-btn:hover { background: rgba(120,70,200,0.6); }
  .api-status { font-size: 0.75rem; width: 100%; color: rgba(150,220,150,0.8); display: none; }

  /* タブ */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 1.5rem;
    border: 1px solid rgba(180,140,255,0.2);
    border-radius: 10px;
    overflow: hidden;
  }
  .tab {
    flex: 1;
    padding: 13px;
    text-align: center;
    font-size: 0.95rem;
    cursor: pointer;
    background: rgba(20,10,40,0.6);
    color: rgba(180,150,220,0.6);
    border: none;
    font-family: inherit;
    letter-spacing: 0.08em;
    transition: all 0.2s;
  }
  .tab.active {
    background: rgba(80,40,140,0.7);
    color: #d4b8ff;
  }
  .tab:not(:last-child) { border-right: 1px solid rgba(180,140,255,0.2); }
  .tab { font-size: 0.82rem; padding: 12px 6px; }

  /* パネル */
  .panel { display: none; }
  .panel.active { display: block; }

  /* フォームカード */
  .card {
    background: rgba(25,12,50,0.7);
    border: 1px solid rgba(180,140,255,0.15);
    border-radius: 14px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }

  .section-title {
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    color: rgba(180,140,255,0.5);
    text-transform: uppercase;
    margin-bottom: 1rem;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(180,140,255,0.1);
  }

  label.lbl {
    display: block;
    font-size: 0.78rem;
    color: rgba(180,150,220,0.7);
    margin-bottom: 5px;
    letter-spacing: 0.05em;
  }

  input[type="text"], input[type="date"], input[type="time"], select, textarea {
    width: 100%;
    background: rgba(15,8,35,0.8);
    border: 1px solid rgba(180,140,255,0.2);
    border-radius: 8px;
    padding: 10px 13px;
    color: #e0d0ff;
    font-family: inherit;
    font-size: 0.9rem;
    margin-bottom: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus { border-color: rgba(180,140,255,0.5); }
  select option { background: #1a0a40; }
  textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media(max-width:480px) { .row { grid-template-columns: 1fr; } }

  /* 生成ボタン */
  .gen-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, rgba(100,50,180,0.8), rgba(140,60,200,0.8));
    border: 1px solid rgba(200,150,255,0.4);
    border-radius: 10px;
    color: #f0e0ff;
    font-family: inherit;
    font-size: 1rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .gen-btn:hover { opacity: 0.9; }
  .gen-btn:active { transform: scale(0.99); }
  .gen-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 画像アップロード */
  .upload-zone {
    border: 1px dashed rgba(180,140,255,0.3);
    border-radius: 10px;
    padding: 1.8rem 1rem;
    text-align: center;
    cursor: pointer;
    margin-bottom: 1rem;
    transition: background 0.2s;
  }
  .upload-zone:hover { background: rgba(100,60,160,0.1); }
  .upload-zone .icon { font-size: 2rem; margin-bottom: 8px; }
  .upload-zone p { font-size: 0.82rem; color: rgba(180,150,220,0.6); line-height: 1.6; }
  input[type="file"] { display: none; }
  .preview-img {
    width: 100%;
    max-height: 220px;
    object-fit: contain;
    border-radius: 8px;
    border: 1px solid rgba(180,140,255,0.2);
    margin-bottom: 1rem;
  }

  /* 結果 */
  .result-area { margin-top: 1rem; }
  .result-box {
    background: rgba(15,8,35,0.9);
    border: 1px solid rgba(180,140,255,0.2);
    border-radius: 12px;
    padding: 1.4rem;
    font-size: 0.9rem;
    line-height: 2;
    color: #ddd0f5;
    white-space: pre-wrap;
    min-height: 100px;
  }
  .result-box.loading { color: rgba(180,150,220,0.5); font-style: italic; }

  .copy-btn {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: transparent;
    border: 1px solid rgba(180,140,255,0.25);
    border-radius: 8px;
    color: rgba(180,150,220,0.7);
    font-family: inherit;
    font-size: 0.82rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.2s;
  }
  .copy-btn:hover { background: rgba(100,60,160,0.15); }

  .notice {
    font-size: 0.72rem;
    color: rgba(150,130,180,0.5);
    text-align: center;
    margin-top: 10px;
    line-height: 1.7;
  }

  .pdf-btn {
    width: 100%;
    margin-top: 8px;
    padding: 11px;
    background: linear-gradient(135deg, rgba(180,120,40,0.4), rgba(200,160,60,0.4));
    border: 1px solid rgba(210,170,80,0.5);
    border-radius: 8px;
    color: #f0d080;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.2s;
  }
  .pdf-btn:hover { opacity: 0.85; }

  @media print {
    body { background: #fff !important; color: #1a0a35 !important; }
    header, .api-section, .tabs, .card, .copy-btn, .pdf-btn, .notice { display: none !important; }
    .result-area { display: block !important; }
    .print-header { display: block !important; }
    .result-box {
      background: #fff !important;
      border: none !important;
      color: #1a0a35 !important;
      font-size: 11pt !important;
      line-height: 2.2 !important;
      white-space: pre-wrap;
      padding: 0 !important;
      font-family: 'Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif !important;
    }
  }

  .print-header {
    display: none;
    text-align: center;
    padding: 20px 0 12px;
    border-bottom: 2px solid #c9a84c;
    margin-bottom: 20px;
  }
  .print-header h1 { font-size: 22pt; color: #1a0a35; letter-spacing: 0.1em; font-family: 'Hiragino Mincho ProN','Yu Mincho',serif; }
  .print-header p { font-size: 10pt; color: #555; margin-top: 6px; }
</style>
</head>
<body>

<header>
  <h1>🔮 占い師ツール</h1>
  <p>四柱推命・手相診断 鑑定文ジェネレーター</p>
</header>

<div class="container">

  <!-- APIキー設定 -->
  <div class="api-section">
    <label>Anthropic APIキー</label>
    <input type="password" id="api-key" placeholder="sk-ant-api03-..." autocomplete="off">
    <button class="api-save-btn" onclick="saveApiKey()">保存</button>
    <p class="api-status" id="api-status">✓ APIキーを保存しました</p>
  </div>

  <!-- タブ -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('shichu')">🌙 四柱推命</button>
    <button class="tab" onclick="switchTab('tesou')">✋ 手相診断</button>
    <button class="tab" onclick="switchTab('aishō')">💑 相性占い</button>
  </div>

  <!-- 四柱推命パネル -->
  <div class="panel active" id="panel-shichu">
    <div class="card">
      <div class="section-title">お客様の基本情報</div>

      <label class="lbl">お名前（ニックネーム可）</label>
      <input type="text" id="s-name" placeholder="例：さくらさん">

      <div class="row">
        <div>
          <label class="lbl">生年月日</label>
          <input type="date" id="s-birth">
        </div>
        <div>
          <label class="lbl">出生時刻（任意）</label>
          <input type="time" id="s-time">
        </div>
      </div>

      <label class="lbl">性別</label>
      <select id="s-gender">
        <option value="女性">女性</option>
        <option value="男性">男性</option>
        <option value="その他">その他</option>
      </select>

      <label class="lbl">相談テーマ</label>
      <select id="s-theme">
        <option value="総合運">総合運（全体的な運勢）</option>
        <option value="恋愛・結婚運">恋愛・結婚運</option>
        <option value="仕事・キャリア運">仕事・キャリア運</option>
        <option value="金運・財運">金運・財運</option>
        <option value="対人関係運">対人関係運</option>
      </select>

      <label class="lbl">お客様の悩みや状況 <span style="color:rgba(255,160,160,0.8); font-size:0.72rem">※ 具体的に書くほど精度が上がります</span></label>
      <textarea id="s-memo" rows="4" placeholder="例）
・転職を半年悩んでいる。今の会社を辞めるべきか
・好きな人がいるが、自分から動いていいのか迷っている
・副業を始めたいが、どの分野が向いているか知りたい
・今年中に結婚できるか。婚活に力を入れるべきか"></textarea>

      <button class="gen-btn" id="s-btn" onclick="generateShichu()">✨ 鑑定文を生成する</button>
    </div>

    <div class="result-area" id="s-result-area" style="display:none">
      <div class="print-header" id="s-print-header">
        <h1>四柱推命 本格鑑定書</h1>
        <p id="s-print-subtitle"></p>
      </div>
      <div class="result-box" id="s-result"></div>
      <button class="copy-btn" onclick="copyResult('s-result')">📋 鑑定文をコピー</button>
      <button class="pdf-btn" onclick="printToPDF('shichu')">📄 PDFとして保存する</button>
      <p class="notice">※ AIが生成した鑑定文です。納品前に内容をご確認・編集ください。</p>
    </div>
  </div>

  <!-- 手相診断パネル -->
  <div class="panel" id="panel-tesou">
    <div class="card">
      <div class="section-title">お客様の情報</div>

      <label class="lbl">お名前（ニックネーム可）</label>
      <input type="text" id="t-name" placeholder="例：ゆいさん">

      <div class="row">
        <div>
          <label class="lbl">診断する手</label>
          <select id="t-hand">
            <option value="右手">右手</option>
            <option value="左手">左手</option>
            <option value="両手">両手</option>
          </select>
        </div>
        <div>
          <label class="lbl">相談テーマ</label>
          <select id="t-theme">
            <option value="総合運">総合運</option>
            <option value="恋愛・結婚運">恋愛・結婚運</option>
            <option value="仕事運">仕事運</option>
            <option value="金運">金運</option>
            <option value="健康運">健康運</option>
          </select>
        </div>
      </div>

      <label class="lbl">手のひらの写真（1枚目・必須）</label>
      <div class="upload-zone" onclick="document.getElementById('t-file1').click()">
        <div class="icon">🤚</div>
        <p>クリックして写真を選択<br><span style="font-size:0.78rem">右手または左手・明るい場所で撮影してください</span></p>
      </div>
      <input type="file" id="t-file1" accept="image/*" onchange="previewImage(event,'t-preview1','t-file2-area','t-btn')">
      <img id="t-preview1" class="preview-img" style="display:none">

      <div id="t-file2-area" style="display:none">
        <label class="lbl">手のひらの写真（2枚目・任意）<span style="font-size:0.72rem; color:rgba(180,150,220,0.6)">　両手を診断する場合に追加</span></label>
        <div class="upload-zone" onclick="document.getElementById('t-file2').click()">
          <div class="icon">🖐</div>
          <p>もう一方の手の写真を追加<br><span style="font-size:0.78rem">追加しない場合は1枚で診断します</span></p>
        </div>
        <input type="file" id="t-file2" accept="image/*" onchange="previewImage2(event)">
        <img id="t-preview2" class="preview-img" style="display:none">
      </div>

      <label class="lbl">お客様の悩みや状況 <span style="color:rgba(255,160,160,0.8); font-size:0.72rem">※ 具体的に書くほど精度が上がります</span></label>
      <textarea id="t-memo" rows="4" placeholder="例）
・結婚線が気になる。いつ頃結婚できるか知りたい
・仕事運が低迷している。転職すべきか手相から見てほしい
・健康面が不安。体に気をつけるべきことがあれば教えてほしい
・生命線が短いように見えて心配している"></textarea>

      <button class="gen-btn" id="t-btn" onclick="generateTesou()" disabled>✨ 診断文を生成する</button>
    </div>

    <div class="result-area" id="t-result-area" style="display:none">
      <div class="print-header" id="t-print-header">
        <h1>手相 本格鑑定書</h1>
        <p id="t-print-subtitle"></p>
      </div>
      <div class="result-box" id="t-result"></div>
      <button class="copy-btn" onclick="copyResult('t-result')">📋 診断文をコピー</button>
      <button class="pdf-btn" onclick="printToPDF('tesou')">📄 PDFとして保存する</button>
      <p class="notice">※ AIが生成した診断文です。納品前に内容をご確認・編集ください。</p>
    </div>
  </div>

  <!-- 相性占いパネル -->
  <div class="panel" id="panel-aishō">
    <div class="card">
      <div class="section-title">Aさん（お客様）の情報</div>

      <label class="lbl">Aさんのお名前</label>
      <input type="text" id="a-name" placeholder="例：さくらさん">

      <div class="row">
        <div>
          <label class="lbl">生年月日</label>
          <input type="date" id="a-birth">
        </div>
        <div>
          <label class="lbl">出生時刻（任意）</label>
          <input type="time" id="a-time">
        </div>
      </div>

      <label class="lbl">性別</label>
      <select id="a-gender">
        <option value="女性">女性</option>
        <option value="男性">男性</option>
        <option value="その他">その他</option>
      </select>
    </div>

    <div class="card">
      <div class="section-title">Bさん（お相手）の情報</div>

      <label class="lbl">Bさんのお名前</label>
      <input type="text" id="b-name" placeholder="例：たろうさん">

      <div class="row">
        <div>
          <label class="lbl">生年月日</label>
          <input type="date" id="b-birth">
        </div>
        <div>
          <label class="lbl">出生時刻（任意）</label>
          <input type="time" id="b-time">
        </div>
      </div>

      <label class="lbl">性別</label>
      <select id="b-gender">
        <option value="男性">男性</option>
        <option value="女性">女性</option>
        <option value="その他">その他</option>
      </select>
    </div>

    <div class="card">
      <div class="section-title">関係性と相談内容</div>

      <label class="lbl">お二人の関係</label>
      <select id="ab-rel">
        <option value="恋人・交際中">恋人・交際中</option>
        <option value="気になっている相手">気になっている相手</option>
        <option value="片思い中">片思い中</option>
        <option value="元恋人・復縁希望">元恋人・復縁希望</option>
        <option value="結婚を考えている相手">結婚を考えている相手</option>
        <option value="ビジネスパートナー">ビジネスパートナー</option>
        <option value="友人・知人">友人・知人</option>
        <option value="家族・親族">家族・親族</option>
        <option value="その他">その他</option>
      </select>

      <label class="lbl">相談テーマ</label>
      <select id="ab-theme">
        <option value="総合的な相性">総合的な相性</option>
        <option value="恋愛・結婚の相性">恋愛・結婚の相性</option>
        <option value="長続きするか・将来性">長続きするか・将来性</option>
        <option value="ビジネス・仕事の相性">ビジネス・仕事の相性</option>
        <option value="復縁の可能性">復縁の可能性</option>
        <option value="関係をよくするアドバイス">関係をよくするアドバイス</option>
      </select>

      <label class="lbl">状況や悩み <span style="color:rgba(255,160,160,0.8); font-size:0.72rem">※ 具体的に書くほど精度が上がります</span></label>
      <textarea id="ab-memo" rows="5" placeholder="例）
・3ヶ月付き合っているが、最近連絡が減ってきた。相手の気持ちが知りたい
・職場の同僚で、告白しようか迷っている。脈ありか教えてほしい
・半年前に別れた元彼と復縁したい。可能性はあるか
・新しいビジネスパートナーと組もうか検討中。相性や注意点を知りたい
・友人と価値観がぶつかることが増えた。どう付き合えばいいか"></textarea>

      <button class="gen-btn" id="ab-btn" onclick="generateAisho()">✨ 相性を鑑定する</button>
    </div>

    <div class="result-area" id="ab-result-area" style="display:none">
      <div class="result-box" id="ab-result"></div>
      <button class="copy-btn" onclick="copyResult('ab-result')">📋 鑑定文をコピー</button>
      <p class="notice">※ AIが生成した鑑定文です。納品前に内容をご確認・編集ください。</p>
    </div>
  </div>

</div>

<script>
  // APIキー管理
  window.onload = function() {
    const saved = localStorage.getItem('uranai_api_key');
    if(saved) {
      document.getElementById('api-key').value = saved;
      document.getElementById('api-status').style.display = 'block';
    }
  };

  function saveApiKey() {
    const key = document.getElementById('api-key').value.trim();
    if(!key) { alert('APIキーを入力してください'); return; }
    localStorage.setItem('uranai_api_key', key);
    const status = document.getElementById('api-status');
    status.style.display = 'block';
    status.textContent = '✓ APIキーを保存しました（このブラウザに記録されます）';
  }

  function getApiKey() {
    const key = document.getElementById('api-key').value.trim() || localStorage.getItem('uranai_api_key');
    if(!key) { alert('APIキーを入力・保存してください'); return null; }
    return key;
  }

  // タブ切り替え
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    const tabs = document.querySelectorAll('.tab');
    if(tab === 'shichu') {
      tabs[0].classList.add('active');
      document.getElementById('panel-shichu').classList.add('active');
    } else if(tab === 'tesou') {
      tabs[1].classList.add('active');
      document.getElementById('panel-tesou').classList.add('active');
    } else {
      tabs[2].classList.add('active');
      document.getElementById('panel-aishō').classList.add('active');
    }
  }

  // 画像プレビュー（1枚目）
  function previewImage(event, previewId, nextAreaId, btnId) {
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById(previewId);
      img.src = e.target.result;

    const resultBox  = document.getElementById('ab-result');
    resultArea.style.display = 'block';
    resultBox.className = 'result-box loading';
    resultBox.textContent = '二人の命式を照合し、相性鑑定書を生成中です。しばらくお待ちください...';

    const fmt = (d) => { const dt = new Date(d); return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`; };
    const today = new Date();

    const prompt = `あなたは四柱推命を40年以上研究してきた最高峰の占い師です。二人の命式を精密に読み解き、本格的な相性鑑定書を作成してください。文字数は6000〜8000字を目標にしてください。

━━━━━━━━━━━━━━━━━━━━
【鑑定対象】
━━━━━━━━━━━━━━━━━━━━
【Aさん（お客様）】
名前：${aName}
生年月日：${fmt(aBirth)}
出生時刻：${aTime || '不明'}
性別：${aGender}

【Bさん（お相手）】
名前：${bName}
生年月日：${fmt(bBirth)}
出生時刻：${bTime || '不明'}
性別：${bGender}

お二人の関係：${rel}
相談テーマ：${theme}
現在の年：${today.getFullYear()}年
${memo ? 'お客様の状況・悩み：' + memo : ''}

━━━━━━━━━━━━━━━━━━━━
【鑑定書の構成】
━━━━━━━━━━━━━━━━━━━━

## 第一章：お二人それぞれの命式（800字）
・${aName}の命式（年柱・月柱・日柱・時柱）と日主の性質を簡潔に
・${bName}の命式（年柱・月柱・日柱・時柱）と日主の性質を簡潔に
・それぞれの五行の特徴と、人間としての本質

## 第二章：二つの命式が出会うとき（1000字）
・五行の相生・相剋関係から見た、二人のエネルギーの相互作用
・「引き合う理由」——なぜこの二人が惹かれ合うのか、命式が教えること
・「摩擦が生まれる理由」——どこでぶつかりやすいか、なぜそうなるのか
・二人の関係の「本質的なテーマ」とは何か

## 第三章：${theme}の詳細鑑定（1200字）
・${theme}において、この二人の相性は命式から見てどうか
・今の大運・流年が二人の関係に与えている影響
・${rel}として、今後1〜2年で起きやすいこと
・この関係の「最大の可能性」と「最大のリスク」
${memo ? '・「' + memo + '」という状況に対して、命式はどんな答えを示しているか' : ''}

## 第四章：${aName}から見た${bName}（800字）
・${aName}の命式から見て、${bName}はどんな存在か
・${aName}が${bName}に惹かれる命式的な理由
・${aName}が${bName}との関係で成長できること
・${aName}が気をつけるべきこと

## 第五章：${bName}から見た${aName}（800字）
・${bName}の命式から見て、${aName}はどんな存在か
・${bName}が${aName}に惹かれる命式的な理由
・この関係で${bName}が得るもの、与えるもの
・${bName}側の視点から見た関係の課題

## 第六章：関係をより良くするためのアドバイス（800字）
・二人が長く良い関係を続けるために最も大切なこと
・お互いの五行的な特徴を活かした、具体的な接し方
・避けるべきパターン・行動
・この関係が最も輝くタイミング（時期・状況）

## 第七章：${aName}への手紙（600字）
・二人の命式全体を見通して、${aName}だけに伝えたいメッセージ
・この出会いが持つ意味、この関係から学べること
・これからの二人に向けた、魂に届く言葉

━━━━━━━━━━━━━━━━━━━━
【絶対に守るルール】
━━━━━━━━━━━━━━━━━━━━
・${aName}に直接語りかける、温かく誠実な文体を貫く
・「相性が良い/悪い」という単純な断言を避け、深い洞察を伝える
・専門用語（干支・五行・十神など）は必ず平易に解説する
・読んだ人が「この二人のことを本当にわかってくれた」と感じる深さを
・希望と現実のバランスを大切に。ネガティブな点も愛を持って伝える
・合計6000字以上を厳守すること`;

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-5',
          max_tokens: 16000,
          messages: [{ role: 'user', content: prompt }]
        })
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error.message);
      const text = data.content?.map(c => c.text || '').join('') || '生成に失敗しました。';
      resultBox.className = 'result-box';
      resultBox.textContent = text;
    } catch(e) {
      resultBox.className = 'result-box';
      resultBox.textContent = 'エラー：' + e.message + '\n\nAPIキーを確認してください。';
    }

    btn.disabled = false;
    btn.textContent = '✨ 相性を鑑定する';
  }
</script>
</body>
</html>
